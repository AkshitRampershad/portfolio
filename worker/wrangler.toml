name = "portfolio-rag"
main = "rag-worker.js"
compatibility_date = "2024-11-01"

# GROQ_API_KEY is set as an encrypted secret, never in this file:
#   wrangler secret put GROQ_API_KEY
# or via the Cloudflare dashboard (Worker → Settings → Variables and Secrets).

# KV namespace backing the footer view counter.
#
# Setup, once — ./setup-views.sh does all of it:
#
#   ./setup-views.sh <GA_LIFETIME_TOTAL>
#
# It creates the namespace, writes its id into `id` below, seeds the lifetime
# total so the counter does not restart from zero, and deploys. Pass the real
# Views figure from GA (Reports -> Engagement -> Pages and screens, all time),
# not an estimate. Commit this file afterwards to keep the id.
#
# The page counts one browser per day, so KV writes track unique visits and
# stay inside the free tier. Until this namespace exists the /views route
# returns 503 and the footer simply omits the counter.
[[kv_namespaces]]
binding = "VIEWS"
id = "PASTE_NAMESPACE_ID_HERE"
